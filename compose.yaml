
services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: task-manager-backend

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000

    container_name: task-manager-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped
