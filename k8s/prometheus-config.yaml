
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: "task-manager-backend"
        metrics_path: /metrics
        scrape_interval: 15s
        basic_auth:
          username_file: /etc/prometheus/secrets/username
          password_file: /etc/prometheus/secrets/password
        static_configs:
          - targets: ["task-manager-backend-service.default.svc.cluster.local:5000"]
